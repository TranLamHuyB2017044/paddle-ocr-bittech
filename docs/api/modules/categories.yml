category_bp.list_workspace_categories:
  tags:
  - Categories
  summary: List workspace categories
  description: List workspace categories.
  produces:
  - application/json
  security:
  - ApiKeyAuth: []
  parameters:
  - name: workspace_id
    in: path
    required: true
    type: string
    description: Workspace id.
  - name: x-device-id
    in: header
    required: false
    type: string
    description: Device identifier; when supplied, it must match the stored device where enforced.
  responses:
    '200':
      description: OK
      schema:
        type: object
        properties:
          statusCode:
            type: integer
            example: 200
          data: {}
        additionalProperties: true
    '401':
      description: Missing or invalid credentials, or device mismatch.
      schema:
        $ref: '#/definitions/ApiError'
    '403':
      description: Forbidden
      schema:
        $ref: '#/definitions/ApiError'
    '500':
      description: Internal Server Error
      schema:
        $ref: '#/definitions/ApiError'
category_bp.create_workspace_category:
  tags:
  - Categories
  summary: Create workspace category
  description: Create workspace category.
  produces:
  - application/json
  security:
  - ApiKeyAuth: []
  consumes:
  - application/json
  parameters:
  - name: workspace_id
    in: path
    required: true
    type: string
    description: Workspace id.
  - name: x-device-id
    in: header
    required: false
    type: string
    description: Device identifier; when supplied, it must match the stored device where enforced.
  - name: body
    in: body
    required: true
    schema:
      type: object
      properties:
        description:
          type: string
        icon:
          type: string
        name:
          type: string
      additionalProperties: true
      required:
      - name
      example:
        name: General
        description: General documents
  responses:
    '201':
      description: Created
      schema:
        type: object
        properties:
          statusCode:
            type: integer
            example: 201
          message:
            type: string
            example: Tạo category thành công
          data: {}
        additionalProperties: true
    '400':
      description: Bad Request
      schema:
        $ref: '#/definitions/ApiError'
    '401':
      description: Missing or invalid credentials, or device mismatch.
      schema:
        $ref: '#/definitions/ApiError'
    '403':
      description: Forbidden
      schema:
        $ref: '#/definitions/ApiError'
    '409':
      description: Conflict
      schema:
        $ref: '#/definitions/ApiError'
    '500':
      description: Internal Server Error
      schema:
        $ref: '#/definitions/ApiError'
