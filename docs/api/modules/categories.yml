    type: string
    description: Device identifier; when supplied, it must match the stored device where enforced.
  responses:
    '200':
      description: OK
      schema:
        type: object
        properties:
          statusCode:
            type: integer
            example: 200
          message: {}
          data:
            type: object
            properties:
              category: {}
              restored_documents: {}
              reindexed_count: {}
              failed_reindex_count: {}
            additionalProperties: true
        additionalProperties: true
    '401':
      description: Missing or invalid credentials, or device mismatch.
      schema:
        $ref: '#/definitions/ApiError'
