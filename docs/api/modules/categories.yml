category_bp.delete_workspace_category:
  tags:
  - Categories
  summary: Delete workspace category
  description: Soft-deletes the category and its related documents/vectors. If documents exist, confirm=true is
    required. Optional reason can be supplied in query or JSON body.
  produces:
  - application/json
  security:
  - ApiKeyAuth: []
  consumes:
  - application/json
  parameters:
  - name: workspace_id
    in: path
    required: true
    type: string
    description: Workspace id.
  - name: slug
    in: path
    required: true
    type: string
    description: Slug.
  - name: reason
    in: query
    required: false
    type: string
  - name: confirm
    in: query
    required: false
    type: string
    default: 'false'
  - name: x-device-id
    in: header
    required: false
    type: string
    description: Device identifier; when supplied, it must match the stored device where enforced.
  - name: body
    in: body
    required: false
    schema:
      type: object
      properties:
        reason:
          type: string
      additionalProperties: true
  responses:
    '200':
      description: OK
      schema:
        type: object
        properties:
          statusCode:
            type: integer
            example: 200
          message: {}
          data:
            type: object
            properties:
              slug: {}
              deleted_documents_count: {}
              deleted_document_ids: {}
            additionalProperties: true
        additionalProperties: true
    '400':
      description: Bad Request
      schema:
        $ref: '#/definitions/ApiError'
    '401':
      description: Missing or invalid credentials, or device mismatch.
      schema:
        $ref: '#/definitions/ApiError'
    '403':
      description: Forbidden
      schema:
        $ref: '#/definitions/ApiError'
    '404':
      description: Not Found
      schema:
        $ref: '#/definitions/ApiError'
    '500':
      description: Internal Server Error
      schema:
        $ref: '#/definitions/ApiError'
