        $ref: '#/definitions/ApiError'
chatbot_bp.public_chat_with_chatbot:
  tags:
  - Public Chatbot
  summary: Public chat with chatbot
  description: 'Requires x-public-token for this chatbot. Provide message; session_id (alias sessionId) is generated
    when omitted. Category scopes the knowledge search. Rate limit: 50 per minute.'
  produces:
  - application/json
  security:
  - PublicTokenAuth: []
  consumes:
  - application/json
  parameters:
  - name: chatbot_id
    in: path
    required: true
    type: string
    description: Chatbot id.
  - name: body
    in: body
    required: true
    schema:
      type: object
      properties:
        message:
          type: string
        category:
          type: string
          description: Active category slug; omit when no category filter is needed.
        session_id:
          type: string
        sessionId:
          type: string
      additionalProperties: true
      required:
      - message
      example:
        message: Hello
        session_id: example-session
  responses:
    '200':
      description: OK
      schema:
        type: object
        properties:
          statusCode:
            type: integer
            example: 200
          data:
            type: object
            properties:
              sessionId: {}
              category: {}
              waitingForContact: {}
            additionalProperties: true
        additionalProperties: true
    '400':
      description: Bad Request
      schema:
        $ref: '#/definitions/ApiError'
    '401':
      description: Missing or invalid credentials, or device mismatch.
      schema:
        $ref: '#/definitions/ApiError'
    '403':
      description: Forbidden
      schema:
        $ref: '#/definitions/ApiError'
    '404':
      description: Not Found
      schema:
