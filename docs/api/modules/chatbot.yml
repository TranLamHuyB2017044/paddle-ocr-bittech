chatbot_bp.get_public_chatbot_details:
  tags:
  - Public Chatbot
  summary: Get public chatbot details
  description: 'Get public chatbot details. Rate limit: 100 per minute.'
  produces:
  - application/json
  security:
  - PublicTokenAuth: []
  parameters:
  - name: chatbot_id
    in: path
    required: true
    type: string
    description: Chatbot id.
  responses:
    '200':
      description: OK
      schema:
        type: object
        properties:
          statusCode:
            type: integer
            example: 200
          data: {}
        additionalProperties: true
    '401':
      description: Missing or invalid credentials, or device mismatch.
      schema:
        $ref: '#/definitions/ApiError'
    '403':
      description: Forbidden
      schema:
        $ref: '#/definitions/ApiError'
    '429':
      description: Rate limit exceeded; response may be JSON or HTML depending on the handler.
    '500':
      description: Internal Server Error
      schema:
        $ref: '#/definitions/ApiError'
chatbot_bp.public_chat_with_chatbot:
  tags:
  - Public Chatbot
  summary: Public chat with chatbot
  description: 'Requires x-public-token for this chatbot. Provide message; session_id (alias sessionId) is generated
    when omitted. Category scopes the knowledge search. Rate limit: 50 per minute.'
  produces:
  - application/json
  security:
  - PublicTokenAuth: []
  consumes:
  - application/json
  parameters:
  - name: chatbot_id
    in: path
    required: true
    type: string
    description: Chatbot id.
  - name: body
    in: body
    required: true
    schema:
      type: object
      properties:
        message:
          type: string
        category:
          type: string
          description: Active category slug; omit when no category filter is needed.
        session_id:
          type: string
        sessionId:
          type: string
      additionalProperties: true
      required:
      - message
      example:
        message: Hello
        session_id: example-session
  responses:
    '200':
      description: OK
      schema:
        type: object
        properties:
          statusCode:
            type: integer
            example: 200
          data:
            type: object
            properties:
              sessionId: {}
              category: {}
              waitingForContact: {}
            additionalProperties: true
        additionalProperties: true
    '400':
      description: Bad Request
      schema:
        $ref: '#/definitions/ApiError'
    '401':
      description: Missing or invalid credentials, or device mismatch.
      schema:
        $ref: '#/definitions/ApiError'
    '403':
      description: Forbidden
      schema:
        $ref: '#/definitions/ApiError'
    '404':
      description: Not Found
      schema:
        $ref: '#/definitions/ApiError'
    '429':
      description: Rate limit exceeded; response may be JSON or HTML depending on the handler.
    '500':
      description: Internal Server Error
      schema:
        $ref: '#/definitions/ApiError'
chatbot_bp.get_public_chatbot_suggestions:
  tags:
  - Public Chatbot
  summary: Get public chatbot suggestions
  description: 'Get public chatbot suggestions. Rate limit: 100 per minute.'
  produces:
  - application/json
  security:
  - PublicTokenAuth: []
  parameters:
  - name: chatbot_id
    in: path
    required: true
    type: string
    description: Chatbot id.
  - name: category
    in: query
    required: false
    type: string
    description: Active category slug; omit when no category filter is needed.
  responses:
    '200':
      description: OK
      schema:
        type: object
        properties:
          statusCode:
            type: integer
            example: 200
          data:
            type: object
            properties:
              suggestions: {}
            additionalProperties: true
        additionalProperties: true
    '401':
      description: Missing or invalid credentials, or device mismatch.
      schema:
        $ref: '#/definitions/ApiError'
    '403':
      description: Forbidden
      schema:
        $ref: '#/definitions/ApiError'
    '429':
      description: Rate limit exceeded; response may be JSON or HTML depending on the handler.
    '500':
      description: Internal Server Error
      schema:
        $ref: '#/definitions/ApiError'
chatbot_bp.create_chatbot:
  tags:
  - Chatbot
  summary: Create chatbot
  description: 'Accepts JSON or multipart form data. Use multipart when uploading files; repeat the files key for
    multiple uploads. A supplied workspace_id must be accessible to the account. Rate limit: 30 per minute.'
  produces:
  - application/json
  security:
  - ApiKeyAuth: []
  consumes:
  - multipart/form-data
  parameters:
  - name: files
    in: formData
    required: false
    type: file
    description: Upload a file. Repeat this field for multiple files (Swagger 2.0 UI selects one file per field).
  - name: x-device-id
    in: header
    required: false
    type: string
    description: Device identifier; when supplied, it must match the stored device where enforced.
  - name: name
    in: formData
    required: true
    type: string
  - name: collect_contact_info
    in: formData
    required: false
    type: boolean
  - name: workspace_id
    in: formData
    required: false
    type: string
    description: Workspace identifier.
  - name: collect_contact
    in: formData
    required: false
    type: boolean
  - name: show_sources
    in: formData
    required: false
    type: boolean
  - name: color
    in: formData
    required: false
    type: integer
    default: 0
  - name: greeting
    in: formData
    required: false
    type: string
    default: ''
  - name: domain
    in: formData
    required: false
    type: string
    default: ecommerce
  - name: description
    in: formData
    required: false
    type: string
    default: ''
  - name: avatar_url
    in: formData
    required: false
    type: string
    default: ''
  - name: telegram_bot_token
    in: formData
    required: false
    type: string
    default: ''
  - name: telegram_chat_id
    in: formData
    required: false
    type: string
    default: ''
  - name: workflow_webhook_url
    in: formData
    required: false
    type: string
    default: ''
  responses:
    '201':
      description: Created
      schema:
        type: object
        properties:
          statusCode:
            type: integer
            example: 201
          message:
            type: string
            example: Chatbot created successfully
          data: {}
        additionalProperties: true
    '400':
      description: Bad Request
      schema:
        $ref: '#/definitions/ApiError'
    '401':
      description: Missing or invalid credentials, or device mismatch.
      schema:
        $ref: '#/definitions/ApiError'
    '403':
      description: Forbidden
      schema:
        $ref: '#/definitions/ApiError'
    '404':
      description: Not Found
      schema:
        $ref: '#/definitions/ApiError'
    '429':
      description: Rate limit exceeded; response may be JSON or HTML depending on the handler.
    '500':
      description: Internal Server Error
      schema:
        $ref: '#/definitions/ApiError'
