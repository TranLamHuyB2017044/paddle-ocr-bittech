rag_bp.upload_to_workspace:
  tags:
  - RAG
  summary: Upload to workspace
  description: Upload files using repeated files keys. Optional category must be an active workspace category. vision=true
    enables vision extraction. Processing is queued; track status using the document status endpoint or SSE.
  produces:
  - application/json
  security:
  - ApiKeyAuth: []
  consumes:
  - multipart/form-data
  parameters:
  - name: workspace_id
    in: path
    required: true
    type: string
    description: Workspace id.
  - name: files
    in: formData
    required: true
    type: file
    description: Upload a file. Repeat this field for multiple files (Swagger 2.0 UI selects one file per field).
  - name: category
    in: formData
    required: false
    type: string
    description: Active category slug; omit when no category filter is needed.
  - name: category
    in: query
    required: false
    type: string
    description: Active category slug; omit when no category filter is needed.
  - name: vision
    in: query
    required: false
    type: string
    default: 'false'
  - name: vision
    in: formData
    required: false
    type: string
    default: 'false'
  - name: x-device-id
    in: header
    required: false
    type: string
    description: Device identifier; when supplied, it must match the stored device where enforced.
  responses:
    '202':
      description: Accepted
      schema:
        type: object
        properties:
          statusCode:
            type: integer
            example: 202
          message: {}
          data:
            type: object
            properties:
              documents: {}
            additionalProperties: true
        additionalProperties: true
    '400':
      description: Bad Request
      schema:
        $ref: '#/definitions/ApiError'
    '401':
      description: Missing or invalid credentials, or device mismatch.
      schema:
        $ref: '#/definitions/ApiError'
    '403':
      description: Forbidden
      schema:
        $ref: '#/definitions/ApiError'
    '413':
      description: Request Entity Too Large
      schema:
        $ref: '#/definitions/ApiError'
    '500':
      description: Internal Server Error
      schema:
        $ref: '#/definitions/ApiError'
