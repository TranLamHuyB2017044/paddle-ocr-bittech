rag_bp.reindex_document:
  tags:
  - RAG
  summary: Reindex document
  description: "Reindex một document đã tồn tại:\n  1. Verify quyền sở hữu\n  2. Lấy raw_text từ MongoDB (ưu tiên)\
    \ hoặc báo lỗi nếu không có\n  3. Xóa vectors cũ trong Qdrant\n  4. Index lại vào Qdrant\n  5. Cập nhật status\
    \ trong MongoDB"
  produces:
  - application/json
  security:
  - ApiKeyAuth: []
  parameters:
