rag_bp.create_workspace:
  tags:
  - RAG
  summary: Create workspace
  description: Create workspace.
  produces:
  - application/json
  security:
  - ApiKeyAuth: []
  consumes:
  - application/json
  parameters:
  - name: x-device-id
    in: header
    required: false
    type: string
    description: Device identifier; when supplied, it must match the stored device where enforced.
  - name: body
    in: body
    required: true
    schema:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
          default: ''
      additionalProperties: true
      required:
      - name
      example:
        name: Example workspace
        description: Knowledge documents
  responses:
    '201':
      description: Created
      schema:
        type: object
        properties:
          statusCode:
            type: integer
            example: 201
          message:
            type: string
            example: Workspace created successfully
          data:
            type: object
            properties:
              workspace_id: {}
            additionalProperties: true
        additionalProperties: true
    '400':
      description: Bad Request
      schema:
        $ref: '#/definitions/ApiError'
    '401':
      description: Missing or invalid credentials, or device mismatch.
      schema:
        $ref: '#/definitions/ApiError'
    '500':
      description: Internal Server Error
      schema:
        $ref: '#/definitions/ApiError'
