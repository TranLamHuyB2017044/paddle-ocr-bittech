auth_bp.admin_register_license:
  tags:
  - Admin
  summary: Admin register license
  description: 'Admin register license. Current middleware limitation: require_role(0) raises an unhandled TypeError
    for authenticated non-admin users, returning HTTP 500 instead of 403. Admin access is unaffected.'
  produces:
  - application/json
  security:
  - ApiKeyAuth: []
  consumes:
  - application/json
  parameters:
  - name: x-device-id
    in: header
    required: false
    type: string
    description: Device identifier; when supplied, it must match the stored device where enforced.
  - name: body
    in: body
    required: true
    schema:
      type: object
      properties:
        label:
          type: string
        expired_at:
          type: string
        notes:
          type: string
          default: ''
      additionalProperties: true
      required:
      - label
      - expired_at
  responses:
    '200':
      description: OK
      schema:
        type: object
        properties:
          statusCode:
            type: integer
            example: 200
          message:
            type: string
            example: Đăng ký license thành công.
          data: {}
        additionalProperties: true
    '400':
      description: Bad Request
      schema:
        $ref: '#/definitions/ApiError'
    '401':
      description: Missing or invalid credentials, or device mismatch.
      schema:
        $ref: '#/definitions/ApiError'
    '403':
      description: Caller role or access is not permitted.
      schema:
        $ref: '#/definitions/ApiError'
    '500':
      description: Internal error, including the current integer-role middleware failure for non-admin users. The
        middleware error may return HTML.
      schema:
        $ref: '#/definitions/ApiError'
