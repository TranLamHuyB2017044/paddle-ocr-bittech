auth_bp.google_login:
  tags:
  - Auth
  summary: Google login
  description: Exchange a Google authorization code for credentials and sign in or register the Google user. redirect_uri
    must match the OAuth flow. Returns local tokens and API key where available.
  produces:
  - application/json
  security: []
  consumes:
  - application/json
  parameters:
  - name: x-device-id
    in: header
    required: false
    type: string
    description: Device identifier; when supplied, it must match the stored device where enforced.
  - name: body
    in: body
    required: true
    schema:
      type: object
      properties:
        code:
          type: string
        redirect_uri:
          type: string
      additionalProperties: true
      required:
      - code
  responses:
    '200':
      description: OK
      schema:
        type: object
        properties:
          statusCode:
            type: integer
            example: 200
          message:
            type: string
            example: Login successful
          data:
            type: object
            properties:
              user: {}
              access_token: {}
              refresh_token: {}
              api_key: {}
              google_info: {}
              google_credentials:
                type: object
                properties:
                  token: {}
                  refresh_token: {}
                  token_uri: {}
                  client_id: {}
                  scopes: {}
                  has_drive_permissions: {}
                additionalProperties: true
            additionalProperties: true
        additionalProperties: true
    '400':
      description: Bad Request
      schema:
        $ref: '#/definitions/ApiError'
    '500':
      description: Internal Server Error
      schema:
        $ref: '#/definitions/ApiError'
auth_bp.google_drive_connect:
  tags:
  - Auth
  summary: Google drive connect
  description: Exchange a Google authorization code with Drive scopes and store the user's Google connection for
    later Sheets/Drive operations.
  produces:
  - application/json
  security: []
  consumes:
  - application/json
  parameters:
  - name: body
    in: body
    required: true
    schema:
      type: object
      properties:
        code:
          type: string
        redirect_uri:
          type: string
      additionalProperties: true
      required:
      - code
  responses:
    '200':
      description: OK
      schema:
        type: object
        properties:
          statusCode:
            type: integer
            example: 200
          message:
            type: string
            example: Drive connection successful
          data:
            type: object
            properties:
              user: {}
              has_drive_permissions: {}
            additionalProperties: true
        additionalProperties: true
    '400':
      description: Bad Request
      schema:
        $ref: '#/definitions/ApiError'
    '500':
      description: Internal Server Error
      schema:
        $ref: '#/definitions/ApiError'
auth_bp.google_drive_disconnect:
  tags:
  - Auth
  summary: Google drive disconnect
  description: Delete the authenticated user's stored Google tokens. Set revoke=true to also attempt revocation
    at Google.
  produces:
  - application/json
  security:
  - ApiKeyAuth: []
  consumes:
  - application/json
  parameters:
  - name: x-device-id
    in: header
    required: false
    type: string
    description: Device identifier; when supplied, it must match the stored device where enforced.
  - name: body
    in: body
    required: true
    schema:
      type: object
      properties:
        revoke:
          type: boolean
          default: false
      additionalProperties: true
  responses:
    '200':
      description: Drive tokens deleted; optional revocation attempted.
      schema:
        type: object
        additionalProperties: true
    '400':
      description: Bad Request
      schema:
        $ref: '#/definitions/ApiError'
    '401':
      description: Missing or invalid credentials, or device mismatch.
      schema:
        $ref: '#/definitions/ApiError'
    '404':
      description: Not Found
      schema:
        $ref: '#/definitions/ApiError'
    '500':
      description: Internal Server Error
      schema:
        $ref: '#/definitions/ApiError'
auth_bp.client_register:
  tags:
  - Auth
  summary: Client register
  description: Register the authenticated user's connection to an external system. user_info accepts a JSON object
    or a serialized JSON string.
  produces:
  - application/json
  security:
  - ApiKeyAuth: []
  consumes:
  - application/json
  parameters:
  - name: x-device-id
    in: header
    required: false
    type: string
    description: Device identifier; when supplied, it must match the stored device where enforced.
  - name: body
    in: body
    required: true
    schema:
      type: object
      properties:
        user_info:
          description: JSON value passed to the integration service.
        system_connection_id:
          type: string
        system_id:
          type: string
        system_register:
          type: string
        description:
          type: string
      additionalProperties: true
  responses:
    '200':
      description: OK
      schema:
        type: object
        properties:
          statusCode:
            type: integer
            example: 200
          message:
            type: string
            example: Client register called successfully
          data: {}
        additionalProperties: true
    '400':
      description: Bad Request
      schema:
        $ref: '#/definitions/ApiError'
    '401':
      description: Missing or invalid credentials, or device mismatch.
      schema:
        $ref: '#/definitions/ApiError'
    '404':
      description: Not Found
      schema:
        $ref: '#/definitions/ApiError'
    '500':
      description: Internal Server Error
      schema:
        $ref: '#/definitions/ApiError'
