docx_bp.save_to_sheet:
  tags:
  - Integrations
  summary: Save to sheet
  description: Requires x-api-key. Uses only the authenticated user's Google connection, verified and bound through
    drive-connect. Legacy unbound connections must reconnect. Optional email must match the caller; optional document_id
    must be owned by the caller or accessible to an admin.
  produces:
  - application/json
  security:
  - ApiKeyAuth: []
  consumes:
  - application/json
  parameters:
  - name: body
    in: body
    required: true
    schema:
      type: object
      properties:
        data:
          description: JSON value passed to the integration service.
        doc_type:
          type: string
          default: document
        email:
          type: string
        document_id:
          type: string
          description: Document identifier.
      additionalProperties: true
  - name: Authorization
    in: header
    required: false
    type: string
    description: Optional Google Bearer token. If supplied it must identify the same user; it does not replace x-api-key.
  responses:
    '200':
      description: OK
      schema:
        type: object
        properties:
          statusCode:
            type: integer
            example: 200
          message:
            type: string
            example: Data saved successfully to User Drive
          data:
            type: object
            properties:
              spreadsheet_id: {}
              sheet_url: {}
              updated_cells: {}
            additionalProperties: true
        additionalProperties: true
    '400':
      description: Bad Request
      schema:
        $ref: '#/definitions/ApiError'
    '403':
      description: Forbidden
      schema:
        $ref: '#/definitions/ApiError'
    '500':
      description: Internal Server Error
      schema:
        $ref: '#/definitions/ApiError'
    '401':
      description: Missing/invalid local API key or invalid optional Google token.
      schema:
        $ref: '#/definitions/ApiError'
    '404':
      description: Document not found.
      schema:
        $ref: '#/definitions/ApiError'
