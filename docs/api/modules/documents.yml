docx_bp.get_user_stats:
  tags:
  - Documents
  summary: Get user stats
  description: Get user stats.
  produces:
  - application/json
  security:
  - ApiKeyAuth: []
  parameters:
  - name: x-device-id
    in: header
    required: false
    type: string
    description: Device identifier; when supplied, it must match the stored device where enforced.
  responses:
    '200':
      description: OK
      schema:
        type: object
        properties:
          statusCode:
            type: integer
            example: 200
          message:
            type: string
            example: Success
          data:
            type: object
            properties:
              total_extractions: {}
              today_extractions: {}
              last_extraction_at: {}
              breakdown: {}
              doc_type_stats: {}
              recent_extractions: {}
              managed_members: {}
            additionalProperties: true
        additionalProperties: true
    '401':
      description: Missing or invalid credentials, or device mismatch.
      schema:
        $ref: '#/definitions/ApiError'
    '404':
      description: Not Found
      schema:
        $ref: '#/definitions/ApiError'
    '500':
      description: Internal Server Error
      schema:
        $ref: '#/definitions/ApiError'
