docx_bp.register:
  tags:
  - Auth
  summary: Register
  description: Public registration creates a regular user (role 4) with a server-selected account/plan. Privileged
    role/account/plan assignment is forbidden. An optional API key must be valid; a manager can create legacy members
    (role 2) only in their own account.
  produces:
  - application/json
  security:
  - {}
  - ApiKeyAuth: []
  consumes:
  - application/json
  parameters:
  - name: body
    in: body
    required: true
    schema:
      type: object
      properties:
        username:
          type: string
        email:
          type: string
        password:
          type: string
          format: password
          minLength: 6
        fullname:
          type: string
        phone:
          type: string
        account_id:
          type: string
      additionalProperties: true
      required:
      - username
      - email
      - password
  responses:
    '201':
      description: Created
      schema:
        type: object
        properties:
          statusCode:
            type: integer
            example: 201
          message:
            type: string
            example: User registered successfully
          data:
            type: object
            properties:
              id: {}
              user_id: {}
              created_plan: {}
            additionalProperties: true
        additionalProperties: true
    '400':
      description: Bad Request
      schema:
        $ref: '#/definitions/ApiError'
    '403':
      description: Forbidden
      schema:
        $ref: '#/definitions/ApiError'
    '429':
      description: Rate limit exceeded; response may be JSON or HTML depending on the handler.
    '500':
      description: Internal Server Error
      schema:
        $ref: '#/definitions/ApiError'
    '401':
      description: A supplied API key is invalid or belongs to an inactive account.
      schema:
        $ref: '#/definitions/ApiError'
