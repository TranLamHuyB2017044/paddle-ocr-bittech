docx_bp.register:
  tags:
  - Auth
  summary: Register
  description: 'Public registration. An optional x-api-key identifies the creator; role, account and plan permissions
    depend on that creator. Rate limit: 5 per minute.'
  produces:
  - application/json
  security:
  - {}
  - ApiKeyAuth: []
  consumes:
  - application/json
  parameters:
  - name: body
    in: body
    required: true
    schema:
      type: object
      properties:
        username:
          type: string
        email:
          type: string
        password:
          type: string
          format: password
        fullname:
          type: string
        phone:
          type: string
        role:
          type: integer
          default: 2
        account_id:
          type: string
        plan:
          type: integer
      additionalProperties: true
      required:
      - username
      - email
      - password
  responses:
    '201':
      description: Created
      schema:
        type: object
        properties:
          statusCode:
            type: integer
            example: 201
          message:
            type: string
            example: User registered successfully
          data:
            type: object
            properties:
              id: {}
              user_id: {}
              created_plan: {}
            additionalProperties: true
        additionalProperties: true
    '400':
      description: Bad Request
      schema:
        $ref: '#/definitions/ApiError'
    '403':
      description: Forbidden
      schema:
        $ref: '#/definitions/ApiError'
    '429':
      description: Rate limit exceeded; response may be JSON or HTML depending on the handler.
    '500':
      description: Internal Server Error
      schema:
        $ref: '#/definitions/ApiError'
docx_bp.admin_reset_quota:
  tags:
  - Admin
  summary: Admin reset quota
  description: 'Admin reset quota. Current middleware limitation: require_role(0) raises an unhandled TypeError
    for authenticated non-admin users, returning HTTP 500 instead of 403. Admin access is unaffected.'
  produces:
  - application/json
  security:
  - ApiKeyAuth: []
  consumes:
  - application/json
  parameters:
  - name: x-device-id
    in: header
    required: false
    type: string
    description: Device identifier; when supplied, it must match the stored device where enforced.
  - name: body
    in: body
    required: true
    schema:
      type: object
      properties:
        account_id:
          type: string
      additionalProperties: true
      required:
      - account_id
  responses:
    '200':
      description: OK
      schema:
        type: object
        properties:
          statusCode:
            type: integer
            example: 200
          message: {}
        additionalProperties: true
    '400':
      description: Bad Request
      schema:
        $ref: '#/definitions/ApiError'
    '401':
      description: Missing or invalid credentials, or device mismatch.
      schema:
        $ref: '#/definitions/ApiError'
    '403':
      description: Caller role or access is not permitted.
      schema:
        $ref: '#/definitions/ApiError'
    '500':
      description: Internal error, including the current integer-role middleware failure for non-admin users. The
        middleware error may return HTML.
      schema:
        $ref: '#/definitions/ApiError'
