services:
  # Redis - Hàng đợi công việc
  redis:
    image: redis:latest
    container_name: paddle-ocr-redis
    ports:
      - "6379:6379"
    restart: always

  # Background Worker - Nơi xử lý OCR và Embedding nặng
  worker:
    build: .
    container_name: paddle-ocr-worker
    command: python run_worker.py
    restart: always
    depends_on:
      - redis
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
      - ./storage:/app/storage
      - ./yolo_model:/app/yolo_model

  # Flask API - Chỉ nhận file và trả về 202
  ocr-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: paddle-ocr-app
    restart: always
    depends_on:
      - redis
    ports:
      - "8080:8080"
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
      - ./storage:/app/storage
      - ./yolo_model:/app/yolo_model
    env_file:
      - .env
    environment:
      - PORT=8080
      - REDIS_URL=redis://redis:6379/0
      - PYTHONUNBUFFERED=1
