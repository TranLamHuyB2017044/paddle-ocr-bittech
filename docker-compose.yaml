services:

  redis:
    image: redis:7.2-alpine                         
    container_name: paddle-ocr-redis
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}               
      --bind 0.0.0.0
      --protected-mode no
      --maxmemory 512mb                             
      --maxmemory-policy allkeys-lru
      --loglevel warning
      --rename-command CONFIG ""
      --rename-command DEBUG ""
      --rename-command SLAVEOF ""
      --rename-command REPLICAOF ""
    restart: unless-stopped          
    networks:
      - ocr-network
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data                            
    security_opt:
      - no-new-privileges:true                     
    read_only: true                                
    tmpfs:
      - /tmp                                        
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 600M                             

  qdrant:
    image: qdrant/qdrant:v1.16.3
    container_name: paddle-ocr-qdrant
    restart: unless-stopped
    networks:
      - ocr-network
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    deploy:
      resources:
        limits:
          memory: 1G

  worker:
    build: .
    container_name: paddle-ocr-worker
    user: "1000:1000"
    command: python src/core/run_worker.py
    network_mode: "host"
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD}@127.0.0.1:6379/0  
      - QDRANT_URL=http://127.0.0.1:6333
      - QDRANT_API_KEY=
      - PRODUCT_QDRANT_URL=http://127.0.0.1:6333
      - PRODUCT_QDRANT_API_KEY=
    volumes:
      - uploads-data:/app/uploads                     
      - logs-data:/app/logs  
      - ./.licensekek:/app/.licensekek:ro
      - ./storage:/app/storage:ro                  
      - ./src:/app/src
      - ./src/modules/ocr/hand_writting:/app/src/modules/ocr/hand_writting
    security_opt:
      - no-new-privileges:true                     
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 5G


  ocr-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: paddle-ocr-app
    user: "1000:1000"
    network_mode: "host"
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    volumes:
      - uploads-data:/app/uploads
      - logs-data:/app/logs
      - ./.licensekek:/app/.licensekek:ro
      - ./storage:/app/storage:ro
      - ./src:/app/src
      - ./src/modules/ocr/hand_writting:/app/src/modules/ocr/hand_writting
    env_file:
      - .env
    environment:
      - PORT=9000
      - REDIS_URL=redis://:${REDIS_PASSWORD}@127.0.0.1:6379/0
      - QDRANT_URL=http://127.0.0.1:6333
      - QDRANT_API_KEY=
      - PRODUCT_QDRANT_URL=http://127.0.0.1:6333
      - PRODUCT_QDRANT_API_KEY=
      - PYTHONUNBUFFERED=1
    command: >
      gunicorn
      --config src/core/config/gunicorn.conf.py
      --bind 0.0.0.0:9000
      --workers 2
      --threads 4
      --timeout 600
      --worker-class gthread
      --preload
      app:app
    security_opt:
      - no-new-privileges:true 
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    deploy:
      resources:
        limits:
          # cpus: "1.0"
          memory: 3G

# ============================================================
# Networks
# ============================================================
networks:
  ocr-network:
    driver: bridge
    internal: false

# ============================================================
# Volumes
# ============================================================
volumes:
  redis-data:
    driver: local
  qdrant-data:
    driver: local
  uploads-data:
    driver: local
  logs-data:
    driver: local
