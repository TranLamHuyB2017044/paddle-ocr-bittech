services:
  # Redis - Hàng đợi công việc
  redis:
    image: redis:latest
    container_name: paddle-ocr-redis
    ports:
      - "63799:6379" # Đổi cổng host từ 6379 thành 63799 để tránh xung đột
    restart: always
    networks:
      - ocr-network

  # Background Worker - Nơi xử lý OCR và Embedding nặng
  worker:
    build: .
    container_name: paddle-ocr-worker
    command: python run_worker.py
    user: root
    restart: always
    depends_on:
      - redis
    links:
      - redis
    networks:
      - ocr-network
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
      - ./storage:/app/storage

  # Flask API - Chỉ nhận file và trả về 202
  ocr-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: paddle-ocr-app
    user: root
    restart: always
    depends_on:
      - redis
    links:
      - redis
    networks:
      - ocr-network
    ports:
      - "8080:8080"
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
      - ./storage:/app/storage
    env_file:
      - .env
    environment:
      - PORT=8080
      - REDIS_URL=redis://redis:6379/0
      - PYTHONUNBUFFERED=1

networks:
  ocr-network:
    driver: bridge
